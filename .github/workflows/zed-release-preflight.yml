name: Zed release preflight

on:
  pull_request:
    paths:
      - ".github/workflows/zed-release-preflight.yml"
      - ".zpkg.toml"
      - "package.json"
      - "src/**"
      - "typespec/**"
      - "templates/**"
      - "test/**"
      - "README.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-release-preflight.yml"
      - ".zpkg.toml"
      - "package.json"
      - "src/**"
      - "typespec/**"
      - "templates/**"
      - "test/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-zed-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZED_CLI_REVISION: c2606c87c8b077dde39d2303bc787077ceb2c9fd

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact package revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact package revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - name: Check out immutable Zed CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REVISION }}
          path: .tools/zed-cli
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
      - name: Build immutable Zed CLI
        run: cargo build --locked --release --bin zed --manifest-path .tools/zed-cli/Cargo.toml
      - name: Validate Zed package metadata
        run: .tools/zed-cli/target/release/zed validate --manifest .zpkg.toml
      - name: Generate credential-free release plan
        shell: bash
        run: |
          set -euo pipefail
          .tools/zed-cli/target/release/zed release plan --json > "$RUNNER_TEMP/ores-contracts-release-plan.json"
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'ores-contracts-release-plan.json')
          with open(path, encoding='utf-8') as fh:
              plan = json.load(fh)
          if not isinstance(plan, (dict, list)):
              raise SystemExit('release plan must be structured JSON')
          PY
      - name: Run native-registry release preflight
        run: .tools/zed-cli/target/release/zed release preflight
      - name: Pack immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/ores-contracts-0.1.1.zpkg"
          archive="$out_dir/oresoftware-ores-contracts-0.1.1.tar.gz"
          .tools/zed-cli/target/release/zed pack --out "$out_dir"
          test -s "$archive"
          sha256sum "$archive" > "$RUNNER_TEMP/ores-contracts-0.1.1.zpkg.sha256"
      - name: Run package smoke contract
        run: npm test
      - name: Prove preflight is read-only
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all \
            | grep -Ev '^\?\? (\.tools/|target/|node_modules/|test/fixtures/(generated|target)/)' || true)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
            exit 1
          fi
