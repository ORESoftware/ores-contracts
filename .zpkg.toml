[package]
org = "oresoftware"
name = "ores-contracts"
version = "0.1.0"
language = "typescript"

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/ores-contracts"

[dependencies]

[build]
command = "npm test"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "npm --prefix \"$ZED_PKG_TEST_TARGET\" test"
exclude = [".env", ".env.*", ".zed/**", ".zed-pack/**", "node_modules/**", "dist/**", "target/**", "**/*.log", ".DS_Store"]

[scripts]
test = "npm test"
